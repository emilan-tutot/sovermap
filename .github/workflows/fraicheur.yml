name: Fraîcheur

# Every 6 hours (brief B.8): if the last published collection (etat.json of the « donnees » branch) is more than 36
# hours old, the issue « Collecte en retard » is opened, or commented when it is already open; once a collection is
# fresh again, the issue is closed. A manual run in trial mode opens it whatever the age (brief B.11) and says so.
# Before the first collection is published, nothing is checked.
# Emergency gesture if GitHub disables this workflow after 60 days without activity: Actions › Fraîcheur ›
# « Enable workflow ».

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : ouvrir l'issue quel que soit l'âge de la dernière collecte"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fraicheur
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.essai }}
      # The run's number, never its address (which names the account).
      RUN: ${{ github.run_number }}
    steps:
      - run: |
          fin=$( (gh api "repos/$REPO/contents/etat.json?ref=donnees" --jq .content | base64 -d | jq -r '.collecte.fin // ""') 2>/dev/null || true)
          if [ -z "$fin" ]; then
            echo "Aucune collecte publiée pour l'instant : rien à vérifier."
            exit 0
          fi
          heures=$(( ($(date -u +%s) - $(date -u -d "$fin" +%s)) / 3600 ))
          echo "Dernière collecte publiée : $fin (il y a $heures h)."
          titre="Collecte en retard"
          n=$(gh issue list --repo "$REPO" --state open --search "\"$titre\" in:title" --json number,title --jq "map(select(.title == \"$titre\")) | .[0].number // empty")
          if [ "$ESSAI" = "true" ] || [ "$heures" -gt 36 ]; then
            {
              if [ "$ESSAI" = "true" ]; then echo "**Essai** (déclenché exprès) : la collecte n'est pas en retard."; echo; fi
              echo "La dernière collecte publiée date de $fin, il y a $heures heures (le seuil est de 36 heures)."
              echo
              echo "Le site sert l'état publié le plus récent, avec sa date. Exécution n° $RUN (Actions › Fraîcheur)."
            } > corps.md
            if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body-file corps.md; else gh issue create --repo "$REPO" --title "$titre" --body-file corps.md; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --repo "$REPO" --comment "La collecte est de nouveau à jour : la dernière date de $fin."
          fi

  # GitHub disables the scheduled workflows of a public repository after 60 days without activity (the owner's answer
  # to point 13, § 8): every 6 hours, this job enables again those GitHub disabled for inactivity (the collection does
  # the same each day), never one disabled by hand, and opens the issue « Workflow planifié désactivé » when one cannot
  # be enabled, with the gesture to make.
  entretien:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          titre="Workflow planifié désactivé"
          echec=""
          for fichier in collecte.yml fraicheur.yml archives.yml copies.yml; do
            etat=$(gh api "repos/$REPO/actions/workflows/$fichier" --jq .state 2> /dev/null || echo "illisible")
            case "$etat" in
              active)
                # Nothing to do: an enable call would make the robot the recipient of the scheduled runs' e-mails.
                :
                ;;
              disabled_inactivity)
                echo "$fichier : désactivé faute d'activité ; réactivation." >&2
                gh api -X PUT "repos/$REPO/actions/workflows/$fichier/enable" > /dev/null || echec="$echec $fichier"
                ;;
              disabled_manually)
                # Disabled by hand: a decision (the collection's politeness lever, point 17, § 3), never undone here.
                echo "$fichier : désactivé à la main ; laissé tel quel." >&2
                ;;
              *)
                echec="$echec $fichier"
                ;;
            esac
          done
          if [ -n "$echec" ]; then
            {
              echo "Ces workflows planifiés n'ont pas pu être réactivés :$echec."
              echo
              echo "Le geste : Actions › le workflow › « Enable workflow »."
            } > corps.md
            n=$(gh issue list --repo "$REPO" --state open --search "\"$titre\" in:title" --json number,title --jq "map(select(.title == \"$titre\")) | .[0].number // empty")
            if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body-file corps.md; else gh issue create --repo "$REPO" --title "$titre" --body-file corps.md; fi
            exit 1
          fi
          echo "Workflows planifiés vérifiés : collecte.yml, fraicheur.yml, archives.yml, copies.yml (ceux désactivés à la main sont laissés)."
