name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to the commit of a release (a tag can be moved); the checkout keeps no token in .git/config.
      # The whole history is fetched: scan:prive reads every commit absent from origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run scan:prive
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run scan:build

  # The public e2e batch on a browser the hosted runner already carries (Google Chrome, PW_CHANNEL=chrome): nothing is
  # downloaded, no system package is installed (no `playwright install --with-deps`, which calls apt). The image is
  # pinned (ubuntu-24.04, not ubuntu-latest, whose label moves to 26.04): the browsers it carries are what this job needs.
  e2e-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: npx playwright test --project=desktop --project=pixel-7
